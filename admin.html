<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>T.E.G Admin — Full CMS Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{max-width:100vw;overflow-x:hidden;font-family:Inter,system-ui,sans-serif;background:#f1f5f9;color:#1a1a1a;min-height:100vh}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:#fff;padding:40px;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.08);width:100%;max-width:380px;text-align:center}
.login-box h1{font-size:22px;margin-bottom:8px;color:#0a3d6b}
.login-box p{font-size:14px;color:#64748b;margin-bottom:28px}
.login-box input{width:100%;padding:12px 14px;border:1px solid #e2e8f0;border-radius:8px;font-size:15px;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 24px;font-size:15px;font-weight:600;border-radius:8px;border:none;cursor:pointer;text-decoration:none}
.btn-primary{background:#f5a623;color:#1a1a1a}.btn-secondary{background:#0a3d6b;color:#fff}.btn-outline{background:#fff;border:1px solid #e2e8f0;color:#1a1a1a}.btn-sm{padding:8px 14px;font-size:13px}.btn-danger{background:#fee2e2;color:#b91c1c}
.hidden{display:none!important}.dashboard{display:none}.dashboard.active{display:block}
.topbar{background:#0a3d6b;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;gap:12px;flex-wrap:nowrap;min-height:56px}
.topbar h1{font-size:16px;margin:0;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .actions{display:flex;align-items:center;gap:8px;flex:0 0 auto;flex-wrap:nowrap;margin-left:auto}
.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 56px)}
.sidebar{background:#fff;border-right:1px solid #e2e8f0;padding:12px 0;overflow-y:auto}
.sidebar button{display:block;width:100%;text-align:left;padding:11px 18px;border:none;background:none;font-size:13px;font-weight:500;color:#475569;cursor:pointer}
.sidebar button:hover,.sidebar button.active{background:#e0f2fe;color:#0369a1;border-right:3px solid #0ea5e9}
.sidebar .group{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#94a3b8;padding:14px 18px 6px}
.main{padding:24px 28px;max-width:920px;overflow-x:hidden}
.panel{display:none;background:#fff;border-radius:12px;padding:24px;border:1px solid #e2e8f0}
.panel.active{display:block}.panel h2{font-size:18px;margin-bottom:4px;color:#0a3d6b}
.form-group{margin-bottom:14px}.form-group label{display:block;font-size:12px;font-weight:600;color:#475569;margin-bottom:5px}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:10px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:14px;font-family:inherit;box-sizing:border-box}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#94a3b8;margin:16px 0 8px}
.sub-card{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:14px;margin-bottom:10px}
.toast{position:fixed;bottom:24px;right:24px;background:#0a3d6b;color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:100}
.toast.show{opacity:1}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{display:none}.sidebar.open{display:block;position:fixed;z-index:45;width:280px;height:100%}}
</style>
</head>
<body>
<div class="login-wrap" id="loginScreen">
<div class="login-box">
<h1>T.E.G Admin</h1>
<p>CMS panel</p>
<input type="password" id="password" placeholder="Password" onkeydown="if(event.key==='Enter')login()" />
<button class="btn btn-primary" style="width:100%" onclick="login()">Login</button>
</div>
</div>
<div class="dashboard" id="dashboard">
<div class="topbar">
<button type="button" class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()" aria-label="Menu">Menu</button>
<h1>T.E.G CMS</h1>
<div class="actions">
<a class="btn btn-outline btn-sm" href="index.html" target="_blank">View site</a>
<button class="btn btn-secondary btn-sm" onclick="saveAll()">Save All</button>
<button class="btn btn-outline btn-sm" onclick="logout()">Logout</button>
</div>
</div>
<div class="layout">
<aside class="sidebar" id="adminSidebar">
<div class="group">Site</div>
<button class="active" data-panel="branding" onclick="showPanel('branding')">Branding & Logo</button>
<button data-panel="contact" onclick="showPanel('contact')">Phone / Address</button>
<button data-panel="media" onclick="showPanel('media')">Media & Uploads</button>
<button data-panel="pageheroes" onclick="showPanel('pageheroes')">Page hero images</button>
<button data-panel="beforeafter" onclick="showPanel('beforeafter');renderBeforeAfterPanel()">Before / After</button>
<div class="group">SEO</div>
<button data-panel="seo" onclick="showPanel('seo')">Global SEO</button>
<button data-panel="pages-seo" onclick="showPanel('pages-seo')">Per-page SEO</button>
<button data-panel="location" onclick="showPanel('location')">Location / GMB</button>
<button data-panel="services" onclick="showPanel('services')">Services + SEO</button>
<div class="group">Navigation</div>
<button data-panel="nav-main" onclick="showPanel('nav-main')">Main Nav</button>
<button data-panel="nav-footer" onclick="showPanel('nav-footer')">Footer Nav</button>
<button data-panel="nav-services" onclick="showPanel('nav-services')">Services Nav</button>
<div class="group">Leads</div>
<button data-panel="inbox" onclick="showPanel('inbox');loadInbox()">Quote Inbox</button>
</aside>
<main class="main">
<div class="panel active" id="panel-branding"><h2>Branding</h2><p>Use existing CMS fields via admin-panel.js</p></div>
<div class="panel" id="panel-contact"><h2>Contact</h2></div>
<div class="panel" id="panel-media"><h2>Media</h2></div>
<div class="panel" id="panel-pageheroes"><h2>Page heroes</h2></div>
<div class="panel" id="panel-beforeafter"><h2>Before / After</h2><div id="baAllServices"></div></div>
<div class="panel" id="panel-seo"><h2>SEO</h2></div>
<div class="panel" id="panel-pages-seo"><h2>Per-page SEO</h2></div>
<div class="panel" id="panel-location"><h2>Location</h2></div>
<div class="panel" id="panel-services"><h2>Services</h2><div id="servicesList"></div></div>
<div class="panel" id="panel-nav-main"><h2>Main Nav</h2><div id="navMainList"></div></div>
<div class="panel" id="panel-nav-footer"><h2>Footer Nav</h2><div id="navFooterList"></div></div>
<div class="panel" id="panel-nav-services"><h2>Services Nav</h2><div id="navServicesList"></div></div>
<div class="panel" id="panel-inbox"><h2>Quote Inbox</h2><div id="inboxList"></div></div>
</main>
</div>
</div>
<div id="toast" class="toast"></div>
<script src="cms-api.js"></script>
<script src="admin-panel.js"></script>
<script src="admin-inbox-fix.js"></script>
<script src="admin-analytics.js"></script>
</body>
</html>
